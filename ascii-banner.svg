  <line x1="0" y1="225" x2="860" y2="225"/><line x1="215" y1="0" x2="215" y2="300"/>
  <line x1="430" y1="0" x2="430" y2="300"/><line x1="645" y1="0" x2="645" y2="300"/>
</g>
<!-- Border -->
<rect x="1" y="1" width="858" height="298" fill="none" stroke="#00f7ff" stroke-width="1" opacity=".2"/>
<!-- Corner brackets -->
<g stroke="#00f7ff" stroke-width="2" fill="none" opacity=".65">
  <polyline points="8,26 8,8 26,8"/><polyline points="834,8 852,8 852,26"/>
  <polyline points="8,274 8,292 26,292"/><polyline points="834,292 852,292 852,274"/>
</g>

<!-- Glitch ghost R -->
