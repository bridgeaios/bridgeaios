<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
<defs>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="sl" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
    <rect y="0" width="1" height="1" fill="rgba(0,0,0,0.28)"/>
  </pattern>
</defs>
<style>
  .m{font-family:'Courier New',Courier,monospace}
  .a{font-size:11px;fill:#00ff88;filter:url(#glow)}
  .ar{font-size:11px;fill:#ff2244;opacity:0}
  .ab{font-size:11px;fill:#22ccff;opacity:0}
  .tag{font-size:15px;fill:#00f7ff;filter:url(#glow2);letter-spacing:7px}
  .sub{font-size:11px;fill:#fff;opacity:.55;letter-spacing:2px}
  .st{font-size:9.5px}
  .tk{font-size:9px;fill:#00f7ff;opacity:.42}
  .cur{font-size:9px;fill:#00ff88}
  @keyframes fi{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .l1{animation:fi .4s .2s both}.l2{animation:fi .4s .38s both}.l3{animation:fi .4s .56s both}
  .l4{animation:fi .4s .74s both}.l5{animation:fi .4s .92s both}.l6{animation:fi .4s 1.1s both}
  @keyframes gl{0%,82%,100%{transform:translate(0,0)}83%{transform:translate(-3px,1px)}84%{transform:translate(3px,-1px)}85%{transform:translate(-1px,0)}86%{transform:translate(0,0)}}
  .mg{animation:gl 7s 2s infinite}
  @keyframes gr{0%,82%,100%{opacity:0;transform:translate(0,0)}83%{opacity:.8;transform:translate(-5px,1px)}84%{opacity:.5;transform:translate(5px,-1px)}85%{opacity:0}}
  @keyframes gb{0%,82%,100%{opacity:0;transform:translate(0,0)}83%{opacity:.5;transform:translate(5px,-1px)}84%{opacity:.8;transform:translate(-5px,1px)}85%{opacity:0}}
  .ggr{animation:gr 7s 2s infinite}.ggb{animation:gb 7s 2s infinite}
  @keyframes tp{0%,100%{opacity:1}50%{opacity:.6}}.tag{animation:tp 3s ease-in-out infinite}
  @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:bl 1s infinite}
</style>

<!-- Background -->
<rect width="860" height="300" fill="#050d14"/>
<!-- Scanlines -->
<rect width="860" height="300" fill="url(#sl)" opacity=".22"/>
<!-- Grid -->
<g opacity=".04" stroke="#00f7ff" stroke-width=".5">
