<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gs" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="hg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00ff88" stop-opacity=".15"/>
    <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .m{font-family:'Courier New',Courier,monospace}
  .nl{font-size:8px;fill:#fff;opacity:.85;text-anchor:middle;font-weight:bold}
  .nr{font-size:6.5px;fill:#00f7ff;opacity:.45;text-anchor:middle}
  @keyframes hp{0%,100%{r:32;opacity:1}50%{r:35;opacity:.8}}
  .hub{animation:hp 2.5s ease-in-out infinite}
  @keyframes np{0%,100%{r:20}50%{r:22}}
  @keyframes df{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
  .conn{stroke-dasharray:8,4;animation:df 1.2s linear infinite}
  @keyframes ri{0%,100%{r:50;opacity:.08}50%{r:58;opacity:.02}}
  .ring{animation:ri 3s ease-in-out infinite}
</style>

<!-- Background -->
<rect width="860" height="200" fill="#050d14"/>

<!-- Border + corners -->
<rect x="1" y="1" width="858" height="198" fill="none" stroke="#00f7ff" stroke-width="1" opacity=".15"/>
<g stroke="#00f7ff" stroke-width="1.5" fill="none" opacity=".5">
  <polyline points="6,18 6,6 18,6"/><polyline points="842,6 854,6 854,18"/>
  <polyline points="6,182 6,194 18,194"/><polyline points="842,194 854,194 854,182"/>
</g>

<!-- Hub aura ring -->
<circle cx="430" cy="100" r="50" fill="none" stroke="#00ff88" stroke-width=".5" opacity=".08" class="ring"/>
<circle cx="430" cy="100" r="70" fill="url(#hg)"/>

<!-- Connection lines (animated dash flow) -->
<g class="conn" fill="none" stroke="#00f7ff" stroke-width="1" opacity=".3">
  <line x1="430" y1="100" x2="430" y2="28"/>
  <line x1="430" y1="100" x2="652" y2="52"/>
  <line x1="430" y1="100" x2="730" y2="100"/>
  <line x1="430" y1="100" x2="652" y2="148"/>
  <line x1="430" y1="100" x2="208" y2="148"/>
  <line x1="430" y1="100" x2="130" y2="100"/>
  <line x1="430" y1="100" x2="208" y2="52"/>
</g>

<!-- Cross-connections (agent-to-agent, dimmer) -->
<g fill="none" stroke="#00f7ff" stroke-width=".5" opacity=".1" stroke-dasharray="3,6">
  <line x1="208" y1="52" x2="130" y2="100"/>
  <line x1="130" y1="100" x2="208" y2="148"/>
  <line x1="652" y1="52" x2="730" y2="100"/>
  <line x1="730" y1="100" x2="652" y2="148"/>
  <line x1="430" y1="28" x2="652" y2="52"/>
  <line x1="430" y1="28" x2="208" y2="52"/>
</g>

<!-- Data packets outbound (green, center to nodes) -->
<g fill="#00ff88">
  <circle r="2.5" opacity="0"><animate attributeName="cx" from="430" to="430" dur="2.2s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="28" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.9;0" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle r="2.5" opacity="0"><animate attributeName="cx" from="430" to="652" dur="2.6s" begin=".3s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="52" dur="2.6s" begin=".3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.9;0" dur="2.6s" begin=".3s" repeatCount="indefinite"/></circle>
  <circle r="2.5" opacity="0"><animate attributeName="cx" from="430" to="730" dur="3s" begin=".7s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="100" dur="3s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.9;0" dur="3s" begin=".7s" repeatCount="indefinite"/></circle>
  <circle r="2.5" opacity="0"><animate attributeName="cx" from="430" to="652" dur="2.4s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="148" dur="2.4s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.9;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle r="2.5" opacity="0"><animate attributeName="cx" from="430" to="208" dur="2.8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="148" dur="2.8s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.9;0" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle r="2.5" opacity="0"><animate attributeName="cx" from="430" to="130" dur="3.2s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="100" dur="3.2s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.9;0" dur="3.2s" begin="1.9s" repeatCount="indefinite"/></circle>
  <circle r="2.5" opacity="0"><animate attributeName="cx" from="430" to="208" dur="2.5s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="52" dur="2.5s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.9;0" dur="2.5s" begin="2.3s" repeatCount="indefinite"/></circle>
</g>

<!-- Data packets inbound (cyan, nodes to center) -->
<g fill="#00f7ff">
  <circle r="1.8" opacity="0"><animate attributeName="cx" from="130" to="430" dur="3.4s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="100" dur="3.4s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;.7;0" dur="3.4s" begin=".5s" repeatCount="indefinite"/></circle>
  <circle r="1.8" opacity="0"><animate attributeName="cx" from="730" to="430" dur="3.1s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="cy" from="100" to="100" dur="3.1s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;.7;0" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle r="1.8" opacity="0"><animate attributeName="cx" from="430" to="430" dur="2.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" from="28" to="100" dur="2.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;.7;0" dur="2.8s" begin="2s" repeatCount="indefinite"/></circle>
  <circle r="1.8" opacity="0"><animate attributeName="cx" from="208" to="430" dur="3.5s" begin="2.8s" repeatCount="indefinite"/><animate attributeName="cy" from="148" to="100" dur="3.5s" begin="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;.7;0" dur="3.5s" begin="2.8s" repeatCount="indefinite"/></circle>
</g>

<!-- HUB: SUPER BRAIN -->
<circle cx="430" cy="100" r="32" fill="#050d14" stroke="#00ff88" stroke-width="2.5" filter="url(#glow)" class="hub"/>
<circle cx="430" cy="100" r="24" fill="none" stroke="#00ff88" stroke-width=".5" opacity=".35"/>
<text class="m" x="430" y="96" text-anchor="middle" font-size="8" fill="#00ff88" filter="url(#gs)" font-weight="bold">SUPER</text>
<text class="m" x="430" y="108" text-anchor="middle" font-size="8" fill="#00ff88" filter="url(#gs)" font-weight="bold">BRAIN</text>

<!-- NODE: CRM (top) -->
<circle cx="430" cy="28" r="20" fill="#050d14" stroke="#FFD700" stroke-width="1.5" filter="url(#gs)">
  <animate attributeName="r" values="20;22;20" dur="3.2s" repeatCount="indefinite"/>
</circle>
<text class="nl" x="430" y="26" fill="#FFD700">CRM</text>
<text class="nr" x="430" y="35">Lead Scoring</text>

<!-- NODE: BILLING (upper right) -->
<circle cx="652" cy="52" r="20" fill="#050d14" stroke="#00ff88" stroke-width="1.5" filter="url(#gs)">
  <animate attributeName="r" values="20;22;20" dur="2.8s" repeatCount="indefinite"/>
</circle>
<text class="nl" x="652" y="50">BILLING</text>
<text class="nr" x="652" y="59">Revenue</text>

<!-- NODE: API GATEWAY (right) -->
<circle cx="730" cy="100" r="20" fill="#050d14" stroke="#00ff88" stroke-width="1.5" filter="url(#gs)">
  <animate attributeName="r" values="20;22;20" dur="3.5s" repeatCount="indefinite"/>
</circle>
<text class="nl" x="730" y="98">API GW</text>
<text class="nr" x="730" y="107">Routing</text>

<!-- NODE: GOD MODE (lower right) -->
<circle cx="652" cy="148" r="20" fill="#050d14" stroke="#FFD700" stroke-width="1.5" filter="url(#gs)">
  <animate attributeName="r" values="20;22;20" dur="2.5s" repeatCount="indefinite"/>
</circle>
<text class="nl" x="652" y="146" fill="#FFD700">GOD MODE</text>
<text class="nr" x="652" y="155">Architect</text>

<!-- NODE: SVG ENGINE (lower left) -->
<circle cx="208" cy="148" r="20" fill="#050d14" stroke="#00f7ff" stroke-width="1.5" filter="url(#gs)">
  <animate attributeName="r" values="20;22;20" dur="3.8s" repeatCount="indefinite"/>
</circle>
<text class="nl" x="208" y="146">SVG ENG</text>
<text class="nr" x="208" y="155">Rendering</text>

<!-- NODE: OSINT (left) -->
<circle cx="130" cy="100" r="20" fill="#050d14" stroke="#00f7ff" stroke-width="1.5" filter="url(#gs)">
  <animate attributeName="r" values="20;22;20" dur="3s" repeatCount="indefinite"/>
</circle>
<text class="nl" x="130" y="98">OSINT</text>
<text class="nr" x="130" y="107">Intel</text>

<!-- NODE: AUTH (upper left) -->
<circle cx="208" cy="52" r="20" fill="#050d14" stroke="#ff6b6b" stroke-width="1.5" filter="url(#gs)">
  <animate attributeName="r" values="20;22;20" dur="3.3s" repeatCount="indefinite"/>
</circle>
<text class="nl" x="208" y="50" fill="#ff6b6b">AUTH</text>
<text class="nr" x="208" y="59">Zero-Trust</text>

<!-- Title -->
<text class="m" x="430" y="195" text-anchor="middle" font-size="8" fill="#00f7ff" opacity=".3" letter-spacing="5">AUTONOMOUS AGENT NETWORK</text>
</svg>
