<rect x="140" y="167" width="0" height="12" fill="#00f7ff" rx="3" filter="url(#glow)">
  <animate attributeName="width" from="0" to="429" dur="1.4s" begin="1.1s" fill="freeze"/>
</rect>
<text class="m pct" x="730" y="177">
  <animate attributeName="opacity" from="0" to="1" dur=".01s" begin="2.55s" fill="freeze"/>74%</text>

<!-- ROW 6: React + Vite  70% → 406px -->
<text class="m label" x="130" y="205">React / Vite</text>
<rect x="140" y="195" width="580" height="12" fill="#161b22" rx="3"/>
<rect x="140" y="195" width="0" height="12" fill="#00f7ff" rx="3" filter="url(#glow)">
  <animate attributeName="width" from="0" to="406" dur="1.4s" begin="1.3s" fill="freeze"/>
</rect>
<text class="m pct" x="730" y="205">
  <animate attributeName="opacity" from="0" to="1" dur=".01s" begin="2.75s" fill="freeze"/>70%</text>

<!-- ROW 7: TypeScript  66% → 383px -->
<text class="m label" x="130" y="233">TypeScript</text>
<rect x="140" y="223" width="580" height="12" fill="#161b22" rx="3"/>
<rect x="140" y="223" width="0" height="12" fill="#4a9eff" rx="3" filter="url(#glow)">
  <animate attributeName="width" from="0" to="383" dur="1.4s" begin="1.5s" fill="freeze"/>
</rect>
<text class="m pct" x="730" y="233">
  <animate attributeName="opacity" from="0" to="1" dur=".01s" begin="2.95s" fill="freeze"/>66%</text>

<!-- ROW 8: Neo4j  60% → 348px -->
<text class="m label" x="130" y="261">Neo4j</text>
<rect x="140" y="251" width="580" height="12" fill="#161b22" rx="3"/>
<rect x="140" y="251" width="0" height="12" fill="#4a9eff" rx="3" filter="url(#glow)">
  <animate attributeName="width" from="0" to="348" dur="1.4s" begin="1.7s" fill="freeze"/>
</rect>
<text class="m pct" x="730" y="261">
  <animate attributeName="opacity" from="0" to="1" dur=".01s" begin="3.15s" fill="freeze"/>60%</text>

<!-- ROW 9: Nginx + Cloudflare  55% → 319px -->
<text class="m label" x="130" y="289">Nginx / CF</text>
<rect x="140" y="279" width="580" height="12" fill="#161b22" rx="3"/>
<rect x="140" y="279" width="0" height="12" fill="#4a9eff" rx="3" filter="url(#glow)">
  <animate attributeName="width" from="0" to="319" dur="1.4s" begin="1.9s" fill="freeze"/>
</rect>
<text class="m pct" x="730" y="289">
  <animate attributeName="opacity" from="0" to="1" dur=".01s" begin="3.35s" fill="freeze"/>55%</text>

<!-- Legend -->
<rect x="740" y="55" width="10" height="10" fill="#00ff88" rx="2"/>
<text x="754" y="64" font-family="Courier New" font-size="8" fill="#484f58">≥80%</text>
<rect x="740" y="72" width="10" height="10" fill="#00f7ff" rx="2"/>
<text x="754" y="81" font-family="Courier New" font-size="8" fill="#484f58">60–79%</text>
<rect x="740" y="89" width="10" height="10" fill="#4a9eff" rx="2"/>
<text x="754" y="98" font-family="Courier New" font-size="8" fill="#484f58">≤59%</text>
</svg>
